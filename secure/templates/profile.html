{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<h2>User Profile</h2>
<p>ID: {{ user['id'] }}</p>
<p>Name: {{ user['full_name'] }}</p>
<p>Username: {{ user['username'] }}</p>
<p>Email: {{ user['email'] }}</p>
<p>Phone: {{ user['phone'] }}</p>
<p>Role: {{ user['role'] }}</p>
<p><a href="/">Back</a></p>
{% endblock %}
