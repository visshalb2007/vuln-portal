<!DOCTYPE html>
<html><head><title>Dashboard</title></head>
<body>
<h2>Club Dashboard</h2>
<p>Role: {{ role }}</p>
<p><a href="/profile/{{ my_id }}">My Profile</a> {% if role == 'admin' %}| <a href="/admin/users">Admin Users</a>{% endif %} | <a href="/logout">Logout</a></p>
<h3>Events</h3>
<ul>
{% for e in events %}
  <li>{{ e['title'] }} - {{ e['description'] }}</li>
{% endfor %}
</ul>
</body></html>
