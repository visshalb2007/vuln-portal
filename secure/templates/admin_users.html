{% extends "base.html" %}

{% block title %}Admin - Users{% endblock %}

{% block content %}
<h2>All Users (Admin)</h2>
<table>
<thead>
  <tr><th>ID</th><th>Username</th><th>Role</th><th>Email</th></tr>
</thead>
<tbody>
{% for u in users %}
  <tr><td>{{ u['id'] }}</td><td>{{ u['username'] }}</td><td>{{ u['role'] }}</td><td>{{ u['email'] }}</td></tr>
{% endfor %}
</tbody>
</table>
<p><a href="/">Back</a></p>
{% endblock %}
