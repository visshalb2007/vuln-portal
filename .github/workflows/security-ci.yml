name: Security CI

on:
  push:
    branches: [ "master", "main", "improve/**" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-tests:
    name: Security Tests & Analysis (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest with Coverage Gate
        run: |
          pytest -v --cov=secure --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=90

      - name: Run Bandit Security SAST Analysis
        run: |
          bandit -r secure/ -ll

      - name: Run Dependency Audit with pip-audit
        run: |
          pip-audit

      - name: Upload Coverage Report Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report-py311
          path: coverage.xml
          retention-days: 14

  poc-verification:
    name: PoC Exploit & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Start Vulnerable App (:5000)
        run: |
          python vulnerable/app.py &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5000/login > /dev/null; then
              echo "Vulnerable app is up!"
              break
            fi
            sleep 1
          done

      - name: Run Exploit Demonstration Script
        run: |
          chmod +x poc/exploit_demo.sh
          ./poc/exploit_demo.sh

      - name: Start Secure App (:5001)
        env:
          SECRET_KEY: "ci-secret-key-at-least-32-bytes-long!"
          SEED_ADMIN_PASSWORD: "admin123"
          SEED_ALICE_PASSWORD: "alicepw"
          SEED_BOB_PASSWORD: "bobpw"
          SESSION_COOKIE_SECURE: "false"
        run: |
          python secure/app.py &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5001/login > /dev/null; then
              echo "Secure app is up!"
              break
            fi
            sleep 1
          done

      - name: Run Fix Verification Script
        run: |
          chmod +x poc/verify_fix.sh
          ./poc/verify_fix.sh
